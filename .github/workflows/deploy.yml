name : sampel
description: This is a sample GitHub Actions workflow for deploying a project.
on:
  push:
    branches:
      - test
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Deploy to server
        run: |
          # Add your deployment commands here, e.g., scp, rsync, etc.
          echo "Deploying to server..."